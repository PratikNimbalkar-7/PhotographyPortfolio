# Project Identification
sonar.projectKey=PhotographyPortfolio
sonar.projectName=PhotographyPortfolio
sonar.projectVersion=1.0

# SonarQube Server (Optional if set in pipeline)
# sonar.host.url=http://localhost:9000

# Source Configuration
sonar.sources=.
sonar.sourceEncoding=UTF-8

# Exclude unnecessary folders
sonar.exclusions=**/bin/**,**/obj/**,**/wwwroot/lib/**,**/Migrations/**

# Test Configuration
sonar.tests=.
sonar.test.inclusions=**/*Tests.cs

# Code Coverage (Optional - If you use Coverlet)
# sonar.cs.opencover.reportsPaths=**/coverage.opencover.xml

# Language (Auto-detected, no need normally)
sonar.language=cs
