name: .NET CI Pipeline

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - "master"
  workflow_dispatch:

jobs:
  build-test:
    runs-on: windows-latest

    steps:

    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Restore
      run: dotnet restore

    - name: Build
      run: dotnet build --no-restore --configuration Release

    - name: Test
      run: dotnet test --no-build --configuration Release

    # 🔥 Trigger Jenkins After Success
    - name: Trigger Jenkins Pipeline
      if: success()
      shell: powershell
      run: |
        $jenkinsUrl = "${{ secrets.JENKINS_URL }}"
        $job = "${{ secrets.JENKINS_JOB }}"
        $token = "${{ secrets.JENKINS_TRIGGER_TOKEN }}"

        $url = "$jenkinsUrl/job/$job/build?token=$token"

        Write-Host "Calling Jenkins: $url"

        Invoke-WebRequest -Uri $url -Method Post -UseBasicParsing
